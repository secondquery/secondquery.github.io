name: Build and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "markdown>=3.7,<4"
      - run: python build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Tell Bing (IndexNow) which pages changed
        run: |
          KEY=$(grep -oP 'INDEXNOW_KEY = "\K[0-9a-f]+' build.py)
          URLS=$(curl -s https://secondquery.com/sitemap.xml | grep -oP '<loc>\K[^<]+' | head -100)
          [ -z "$URLS" ] && exit 0
          JSON=$(printf '%s\n' $URLS | python3 -c "import sys,json;print(json.dumps({'host':'secondquery.com','key':'$KEY','keyLocation':'https://secondquery.com/$KEY.txt','urlList':[l.strip() for l in sys.stdin if l.strip()]}))")
          curl -s -o /dev/null -w "IndexNow: %{http_code}\n" -X POST https://api.indexnow.org/indexnow -H "Content-Type: application/json; charset=utf-8" -d "$JSON" || true
